name: CI

# Doc-only changes skip CI. Don't ignore **.md: test fixtures are Markdown.
# Keep this list in sync with the Workflow section of CLAUDE.md.
on:
  push:
    branches: [ main ]
    paths-ignore: [ "_docs/**", "README.md", "CLAUDE.md", "LICENSE" ]
  pull_request:
    paths-ignore: [ "_docs/**", "README.md", "CLAUDE.md", "LICENSE" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Path handling differs per OS, so let every combination report
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # 22 is the engines floor, 24 the current LTS
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
